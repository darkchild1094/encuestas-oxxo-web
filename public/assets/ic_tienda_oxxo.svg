<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Fachada / pared -->
  <rect x="40" y="126" width="120" height="54" fill="#BFC3C7"/>
  <rect x="40" y="126" width="14" height="54" fill="#A7ABAF"/>

  <!-- Ventana izquierda (4 paneles + barra roja) -->
